# Main Edge nginx Configuration - Phase 2 Single Mac
# File: config/nginx/nginx-main.conf

worker_processes 1;
pid /tmp/nginx-main.pid;
error_log /tmp/nginx-main-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-main-access.log;

    # Local caching configuration
    proxy_cache_path /tmp/nginx-cache-main levels=1:2 keys_zone=main_cache:10m max_size=50m inactive=60m use_temp_path=off;

    # High Availability Upstream Pool with Passive Health Checks
    upstream cnproject_backends {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:3002 max_fails=1 fail_timeout=5s;
    }

    # HTTP Listener
    server {
        listen 127.0.0.1:8080;
        server_name app.cnproject.test api.cnproject.test;

        add_header X-Edge "Main" always;

        location / {
            proxy_pass http://cnproject_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            include /Users/ritikraj/CN-Project/config/nginx/security-token.conf;

            # Robust proxy failover settings
            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
    }

    # HTTPS Listener (TLS Termination)
    server {
        listen 127.0.0.1:8443 ssl;
        server_name app.cnproject.test api.cnproject.test;

        ssl_certificate /Users/ritikraj/CN-Project/config/nginx/certs/app.cnproject.test.crt;
        ssl_certificate_key /Users/ritikraj/CN-Project/config/nginx/certs/app.cnproject.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Edge "Main" always;

        location = /api/status {
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_pass http://cnproject_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            include /Users/ritikraj/CN-Project/config/nginx/security-token.conf;

            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location / {
            proxy_cache main_cache;
            proxy_cache_valid 200 60s;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=60" always;
            add_header X-Edge "Main" always;

            proxy_pass http://cnproject_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            include /Users/ritikraj/CN-Project/config/nginx/security-token.conf;

            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
    }
}
