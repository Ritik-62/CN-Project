# Primary DNS Configuration - Phase 2 Single Mac
# File: config/dnsmasq/dnsmasq-primary.conf

port=5355
listen-address=127.0.0.1
bind-interfaces
no-resolv

pid-file=/tmp/dnsmasq-primary.pid
log-queries
log-facility=/tmp/dnsmasq-primary.log

# Project Domain Records
addn-hosts=/Users/ritikraj/CN-Project/config/dnsmasq/records.hosts
local-ttl=30

# External Forwarding
server=8.8.8.8
