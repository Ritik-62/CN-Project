# Caching Resolver Configuration - Phase 2 Single Mac
# File: config/dnsmasq/dnsmasq-cache.conf

port=5356
listen-address=127.0.0.1
bind-interfaces
no-resolv

pid-file=/tmp/dnsmasq-cache.pid
log-queries
log-facility=/tmp/dnsmasq-cache.log

# Forward to Primary Authoritative DNS
server=127.0.0.1#5355
cache-size=150
