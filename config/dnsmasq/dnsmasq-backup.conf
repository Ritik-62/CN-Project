# Backup DNS Configuration - Phase 2 Single Mac
# File: config/dnsmasq/dnsmasq-backup.conf

port=5354
listen-address=127.0.0.1
bind-interfaces
no-resolv

pid-file=/tmp/dnsmasq-backup.pid
log-queries
log-facility=/tmp/dnsmasq-backup.log

# Project Domain Records (Identical to Primary)
addn-hosts=/Users/ritikraj/CN-Project/config/dnsmasq/records.hosts
local-ttl=30

# External Forwarding
server=8.8.8.8
